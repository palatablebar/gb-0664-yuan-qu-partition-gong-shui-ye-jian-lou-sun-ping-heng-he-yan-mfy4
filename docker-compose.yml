name: p1109-0664
services:
  app:
    build: .
    ports: ["18203:8000"]
    environment:
      DATA_DIR: /data
    volumes: ["records:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  records:
