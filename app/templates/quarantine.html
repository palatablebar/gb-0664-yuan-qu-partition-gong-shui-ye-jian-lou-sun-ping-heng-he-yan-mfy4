{% extends 'base.html' %}
{% block panels %}
<section class="panel primary-panel"><div class="panel__head"><h2>隔离记录</h2><span>m³</span></div><div class="panel__body flush">{{ gridtable(data.quarantine, [('line','来源行'),('code','原因码'),('raw','原始证据')]) }}</div></section>
<section class="panel comparison-panel"><div class="panel__head"><h2>核对依据</h2><span>QUARANTINE</span></div><div class="panel__body"><h3>隔离原因</h3>{% for code,count in data.reason_counts.items() %}<div class="diff-row"><span>{{ code }}</span><b class="num">{{ count }}</b></div>{% endfor %}</div></section>
{% endblock %}
